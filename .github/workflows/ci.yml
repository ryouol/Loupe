name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: brew install actionlint osv-scanner shellcheck swift-format xcodegen

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.8"

      - name: Bootstrap
        run: make bootstrap

      - name: Verify and audit dependency lock
        run: |
          uv lock --project adapters/loupe-mlx --check
          uv export --project adapters/loupe-mlx --locked --extra dev --extra mlx --no-hashes --no-emit-project \
            | uvx --from pip-audit==2.10.1 pip-audit -r /dev/stdin --progress-spinner off
          osv-scanner scan source -L Package.resolved -L adapters/loupe-mlx/uv.lock --verbosity warn

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Validate bundled sample
        run: .venv/bin/python scripts/validate-sample.py

      - name: Replay and audit the real MLX investigation
        run: |
          mkdir -p .build/investigation
          tar -xzf investigations/mlx-2026-09-16/recordings.tar.gz -C .build/investigation
          .venv/bin/python scripts/check-investigation.py .build/investigation/verified --manifest investigations/mlx-2026-09-16/SHA256.json

      - name: Build unsigned package smoke artifact
        env:
          LOUPE_RELEASE_TESTS_PASSED: "1"
        run: make dist

      - name: Upload unsigned smoke artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loupe-unsigned-smoke
          path: |
            dist/*-unsigned.dmg
            dist/*.sha256
          if-no-files-found: error
