name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen swift-format

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Bootstrap
        run: make bootstrap

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test
