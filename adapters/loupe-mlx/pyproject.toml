[project]
name = "loupe-mlx"
version = "0.1.0"
description = "Instruments mlx-lm inference and streams events to the Loupe daemon."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.21"]
mlx = ["mlx-lm>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loupe_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
