name: Loupe

options:
  bundleIdPrefix: ai.squint
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Signing lives in Local.xcconfig (gitignored). It is created from
# Local.xcconfig.template by `make bootstrap`. DEVELOPMENT_TEAM stays empty
# until M0.6; local/CI builds pass CODE_SIGNING_ALLOWED=NO.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  LoupePackage:
    path: .

targets:
  Loupe:
    type: application
    platform: macOS
    sources:
      - Sources/LoupeAppMain
      - Resources
    dependencies:
      - package: LoupePackage
        product: LoupeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.squint.loupe
        PRODUCT_NAME: Loupe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Loupe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSMinimumSystemVersion: "15.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Roy Luo"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        # The embed script writes into the bundle and shells out to SPM;
        # Xcode's script sandbox forbids both.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      # SMAppService requires the daemon binary at Contents/MacOS/ and its
      # plist at Contents/Library/LaunchDaemons/, with plist filename ==
      # Label == mach service name. The daemon is an SPM product, so build
      # it with SPM and copy it in — least-fragile way to embed one.
      - name: Embed loupedaemon
        script: |
          set -euo pipefail
          CONFIG=$(printf '%s' "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')
          cd "$SRCROOT"
          swift build -c "$CONFIG" --product loupedaemon
          BIN="$(swift build -c "$CONFIG" --show-bin-path)/loupedaemon"
          mkdir -p "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH"
          cp "$BIN" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/loupedaemon"
          DAEMONS_DIR="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          mkdir -p "$DAEMONS_DIR"
          cp "$SRCROOT/Support/ai.squint.loupe.daemon.plist" "$DAEMONS_DIR/"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/loupedaemon"
          fi
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/loupedaemon
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/ai.squint.loupe.daemon.plist

schemes:
  Loupe:
    build:
      targets:
        Loupe: all
    run:
      config: Debug
    test:
      config: Debug
